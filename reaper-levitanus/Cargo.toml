[package]
edition = "2021"
name = "reaper-levitanus"
version = "0.0.1"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
rea-rs = {workspace = true}
rea-rs-macros = {workspace = true}

env_logger = {workspace = true}
log = {workspace = true}

anyhow = {workspace = true}
autopilot = {workspace = true}
dyn-clone = {workspace = true}
fraction = {workspace = true, features = ["with-serde-support"]}
itertools = {workspace = true}
lazy_static = {workspace = true}
open = "3.2.0"
path-absolutize = {workspace = true}
regex = {workspace = true}
serde = {workspace = true, features = ["derive"]}
serde_json = {workspace = true}
strum = {workspace = true, features = ["derive"]}
thiserror = {workspace = true}

int-enum = "1.1.2"
url = "2.5.0"
uuid = {version = "1.8.0", features = ["v4"]}

verovioxide = "0.3"
verovioxide-sys = { version = "0.3", features = ["prebuilt"] }
musical-note = "0.1.105"
musicxml = "1.1"

[lib]
crate-type = ["lib"]
name = "reaper_levitanus"
